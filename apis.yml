aid: bostongene
name: BostonGene
description: 'BostonGene is a Waltham, Massachusetts precision-oncology company that
  combines an in-house CLIA-certified and CAP-accredited clinical laboratory with an
  AI-powered bioinformatics platform. It integrates whole-exome and whole-transcriptome
  sequencing, liquid biopsy (cfDNA/cfRNA), single-cell RNA sequencing, flow cytometry,
  spatial proteomics and digital pathology into multimodal molecular and immune profiling.
  Its clinical products include the Tumor Portrait test, immune system profiling, an
  immunohistochemistry (IHC) test and an Unknown Primary test; its biopharma services
  cover target analysis, biomarker discovery, clinical trial support, drug indication
  expansion and unmet-need identification. BostonGene publishes open-source research
  software (Kassandra cell deconvolution, Molecular Functional Portraits, pyigmap)
  on GitHub, but exposes no public developer API, SDK or API documentation; clinician
  ordering and report delivery run through an authenticated Salesforce Experience Cloud
  customer portal.'
